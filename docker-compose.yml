services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fotos
      POSTGRES_PASSWORD: fotos123
      POSTGRES_DB: fotosdb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotos -d fotosdb"]
      interval: 3s
      retries: 10

  almacenamiento:
    build: ./almacenamiento
    volumes:
      - fotos_data:/data

  api:
    build: ./api
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      almacenamiento:
        condition: service_started

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
  fotos_data: