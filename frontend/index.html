<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie · Fotografía compartida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f1ea; --tinta:#1c1a17; --suave:#8a8178; --linea:#e2d9cc;
  --dorado:#a8865a; --blanco:#fffdf9;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);font-weight:300}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:40px 56px 28px;border-bottom:1px solid var(--linea)}
.marca h1{font-family:var(--serif);font-weight:500;font-size:3.2rem;letter-spacing:.02em;line-height:1}
.marca h1 em{color:var(--dorado)}
.marca p{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--suave);margin-top:10px}
.btn{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;padding:14px 28px;border:1px solid var(--tinta);background:transparent;color:var(--tinta);cursor:pointer;transition:.3s}
.btn:hover{background:var(--tinta);color:var(--papel)}
.btn.lleno{background:var(--tinta);color:var(--papel)}
.btn.texto{border-color:transparent}
.layout{display:grid;grid-template-columns:1fr 300px;gap:48px;padding:40px 56px}
.galeria{columns:3 240px;column-gap:28px}
.obra{break-inside:avoid;margin-bottom:32px;animation:aparecer .8s both}
.obra img{width:100%;display:block;background:var(--linea)}
.obra figcaption{padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.obra .titulo{font-family:var(--serif);font-style:italic;font-size:1.3rem}
.obra .autor{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);white-space:nowrap}
.obra.nueva img{outline:1px solid var(--dorado);outline-offset:6px}
@keyframes aparecer{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vacio{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--suave)}
aside{position:sticky;top:24px;align-self:start;border-left:1px solid var(--linea);padding-left:32px}
aside h2{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--suave);font-weight:500;margin-bottom:14px}
.bloque{margin-bottom:36px}
.estado{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.25rem}
.punto{width:8px;height:8px;border-radius:50%;background:#b5533c}
.punto.ok{background:#4f7d5c;box-shadow:0 0 0 4px rgba(79,125,92,.15)}
.cifra{font-family:var(--serif);font-size:2.8rem;line-height:1}
.replica{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:14px;font-size:.78rem}
.replica .barra{grid-column:span 2;height:2px;background:var(--linea)}
.replica .barra i{display:block;height:100%;background:var(--dorado);transition:width .4s}
.replica.activa span:first-child{color:var(--dorado);font-weight:500}
#actividad li{list-style:none;font-size:.78rem;padding:10px 0;border-bottom:1px solid var(--linea);color:var(--suave)}
#actividad li b{color:var(--tinta);font-weight:500}
dialog{border:none;padding:48px;background:var(--blanco);width:min(460px,92vw);margin:auto}
dialog::backdrop{background:rgba(28,26,23,.55);backdrop-filter:blur(3px)}
dialog h3{font-family:var(--serif);font-weight:500;font-size:2.2rem;margin-bottom:28px}
dialog label{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--suave);margin-bottom:22px}
dialog input{display:block;width:100%;margin-top:8px;padding:10px 0;border:none;border-bottom:1px solid var(--linea);background:transparent;font-family:var(--sans);font-size:1rem;color:var(--tinta);text-transform:none;letter-spacing:0}
dialog input:focus{outline:none;border-color:var(--dorado)}
.acciones{display:flex;gap:12px;justify-content:flex-end;margin-top:12px}
#info{font-size:.78rem;color:var(--suave);margin-top:16px;min-height:1em}
#aviso{position:fixed;bottom:32px;left:50%;transform:translate(-50%,20px);background:var(--tinta);color:var(--papel);padding:14px 28px;font-size:.78rem;letter-spacing:.1em;opacity:0;transition:.4s;pointer-events:none}
#aviso.ver{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){header{padding:28px 24px}.layout{grid-template-columns:1fr;padding:24px}aside{border-left:none;padding-left:0;position:static}}
</style>
</head>
<body>
<header>
  <div class="marca">
    <h1>Galer<em>ie</em></h1>
    <p>Fotografía compartida · Sistema distribuido</p>
  </div>
  <button class="btn" id="abrir">Compartir fotografía</button>
</header>

<div class="layout">
  <main class="galeria" id="galeria"></main>
  <aside>
    <div class="bloque">
      <h2>Conexión</h2>
      <div class="estado"><span class="punto" id="punto"></span><span id="estado">Conectando…</span></div>
    </div>
    <div class="bloque">
      <h2>Obras en la colección</h2>
      <div class="cifra" id="total">0</div>
    </div>
    <div class="bloque">
      <h2>Réplicas de la API</h2>
      <div id="replicas"></div>
    </div>
    <div class="bloque">
      <h2>Actividad</h2>
      <ul id="actividad"></ul>
    </div>
  </aside>
</div>

<dialog id="modal">
  <h3>Nueva obra</h3>
  <form id="formulario">
    <label>Autor<input name="autor" required></label>
    <label>Título<input name="descripcion"></label>
    <label>Fotografía<input type="file" name="archivo" accept="image/*" required></label>
    <div class="acciones">
      <button type="button" class="btn texto" id="cerrar">Cancelar</button>
      <button class="btn lleno">Publicar</button>
    </div>
    <p id="info"></p>
  </form>
</dialog>
<div id="aviso"></div>

<script>
const $ = id => document.getElementById(id);
const ids = new Set();
const latidos = {};
let ws;

function obra(f, nueva) {
  if (ids.has(f.id)) return;
  ids.add(f.id);
  $("vacio")?.remove();
  const fig = document.createElement("figure");
  fig.className = "obra" + (nueva ? " nueva" : "");
  const img = document.createElement("img");
  img.src = "/api" + f.url;
  img.alt = f.descripcion || "Fotografía";
  img.loading = "lazy";
  const cap = document.createElement("figcaption");
  const t = document.createElement("span");
  t.className = "titulo";
  t.textContent = f.descripcion || "Sin título";
  const a = document.createElement("span");
  a.className = "autor";
  a.textContent = f.autor;
  cap.append(t, a);
  fig.append(img, cap);
  nueva ? $("galeria").prepend(fig) : $("galeria").append(fig);
  $("total").textContent = ids.size;
}

async function cargar() {
  const r = await fetch("/api/fotos");
  const d = await r.json();
  if (!d.fotos.length && !ids.size)
    $("galeria").innerHTML = '<p class="vacio" id="vacio">La colección aún está vacía.</p>';
  d.fotos.forEach(f => obra(f, false));
}

function registrar(texto, instancia) {
  const li = document.createElement("li");
  const b = document.createElement("b");
  b.textContent = texto;
  li.append(b, document.createTextNode(" · réplica " + instancia));
  $("actividad").prepend(li);
  while ($("actividad").children.length > 5) $("actividad").lastChild.remove();
}

async function latido() {
  let actual = null;
  try {
    const r = await fetch("/api/salud", { cache: "no-store" });
    const d = await r.json();
    actual = d.instancia;
    latidos[actual] = latidos[actual] || { n: 0 };
    latidos[actual].n++;
    latidos[actual].visto = Date.now();
  } catch (e) {}
  pintarReplicas(actual);
}

function pintarReplicas(actual) {
  const vivas = Object.entries(latidos).filter(([, v]) => Date.now() - v.visto < 10000);
  const total = vivas.reduce((s, [, v]) => s + v.n, 0) || 1;
  $("replicas").innerHTML = "";
  vivas.forEach(([id, v]) => {
    const div = document.createElement("div");
    div.className = "replica" + (id === actual ? " activa" : "");
    const nom = document.createElement("span");
    nom.textContent = id;
    const cnt = document.createElement("span");
    cnt.textContent = v.n + " resp.";
    const barra = document.createElement("div");
    barra.className = "barra";
    const i = document.createElement("i");
    i.style.width = (v.n / total * 100) + "%";
    barra.append(i);
    div.append(nom, cnt, barra);
    $("replicas").append(div);
  });
}

function avisar(m) {
  const a = $("aviso");
  a.textContent = m;
  a.classList.add("ver");
  clearTimeout(a._t);
  a._t = setTimeout(() => a.classList.remove("ver"), 3000);
}

function conectar() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $("punto").classList.add("ok"); $("estado").textContent = "En vivo"; };
  ws.onclose = () => {
    $("punto").classList.remove("ok");
    $("estado").textContent = "Reconectando…";
    setTimeout(conectar, 2000);
  };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.tipo === "nueva_foto") {
      obra(ev, true);
      registrar(ev.autor + " publicó una obra", ev.atendido_por);
      avisar("Nueva obra de " + ev.autor);
    }
  };
}

$("abrir").onclick = () => $("modal").showModal();
$("cerrar").onclick = () => $("modal").close();
$("formulario").onsubmit = async e => {
  e.preventDefault();
  $("info").textContent = "Publicando…";
  const r = await fetch("/api/fotos", { method: "POST", body: new FormData(e.target) });
  const d = await r.json();
  if (!r.ok) { $("info").textContent = "No se pudo publicar: " + JSON.stringify(d.detail); return; }
  $("info").textContent = "";
  e.target.reset();
  $("modal").close();
  if (ws.readyState !== WebSocket.OPEN) { cargar(); registrar("Obra publicada", d.atendido_por); }
};

cargar();
conectar();
latido();
setInterval(latido, 1500);
</script>
</body>
</html>
